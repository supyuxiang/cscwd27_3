# Config for policy/my_sft_trainer_v1.py: Qwen2.5-0.5B full SFT on GSM8K.
# Group files (model, engine, optim, profiler) come from the vendored verl trainer config.
# _self_ is last so the values in this file override those groups.

defaults:
  - model@model: hf_model
  - engine@engine: fsdp
  - optim@optim: fsdp
  - profiler@profiler: profiler
  - _self_

hydra:
  searchpath:
    - file:///home/yxfeng/cscwd27_ranker/verl/verl/trainer/config
  job:
    chdir: false

data:
  train_batch_size: 32
  micro_batch_size_per_gpu: 16
  max_token_len_per_gpu: 4096
  use_dynamic_bsz: False
  train_files: /data3/yxfeng/datasets/gsm8k/sft_base/train.json
  val_files: /data3/yxfeng/datasets/gsm8k/sft_base/test.json
  train_max_samples: -1
  val_max_samples: -1
  messages_key: messages
  tools_key: tools
  enable_thinking_key: enable_thinking
  enable_thinking_default: null
  pad_mode: no_padding
  max_length: 768
  truncation: error
  balance_dp_token: False
  custom_cls:
    path: null
    name: null
  use_shm: False
  apply_chat_template_kwargs: {}
  num_workers: 0
  ignore_input_ids_mismatch: False
  # Kept rows must be at least this many after the question+response length filter.
  min_rows: 5000

checkpoint:
  _target_: verl.trainer.config.CheckpointConfig
  save_contents: ["model", "optimizer", "extra"]
  load_contents: ${checkpoint.save_contents}

trainer:
  default_local_dir: /data3/yxfeng/cscwd27_ranker/sft/qwen2.5-0.5b-gsm8k
  default_hdfs_dir: null
  project_name: gsm8k-sft
  experiment_name: qwen2.5-0.5b-full
  total_epochs: 2
  total_training_steps: null
  logger: ["console", "swanlab"]
  seed: 1
  save_freq: after_each_epoch
  test_freq: after_each_epoch
  sample_freq: 0
  max_ckpt_to_keep: null
  balance_batch: True
  resume_mode: auto
  resume_from_path: null
  device: cuda
  nnodes: 1
  n_gpus_per_node: 1
  profile_interval: [-1, -1]

model:
  path: /data3/yxfeng/models/Qwen2.5/Qwen2.5-0.5B
  lora_rank: 0
  enable_gradient_checkpointing: True
  use_remove_padding: True
  trust_remote_code: False

engine:
  model_dtype: bf16
  dtype: bfloat16
  strategy: fsdp

optim:
  lr: 2.0e-5
  lr_scheduler_type: cosine
  lr_warmup_steps_ratio: 0.03
