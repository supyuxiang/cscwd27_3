hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath:
  - file:///home/yxfeng/cscwd27_ranker/verl/verl/trainer/config
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - model.path=/data3/yxfeng/models/Qwen2.5/Qwen2.5-3B
    - data.train_files=/data3/yxfeng/cscwd27_ranker/gsm8k_rej/train_correct.json
    - data.val_files=/data3/yxfeng/datasets/gsm8k/sft_base/test.json
    - data.train_batch_size=32
    - data.micro_batch_size_per_gpu=1
    - data.max_length=768
    - trainer.default_local_dir=/data3/yxfeng/cscwd27_ranker/sft/qwen2.5-3b-rej
    - trainer.experiment_name=qwen2.5-3b-rej
    - trainer.project_name=gsm8k-sft
    - trainer.total_epochs=2
    - trainer.save_freq=after_each_epoch
    - trainer.test_freq=after_each_epoch
    - trainer.sample_freq=0
    - trainer.n_gpus_per_node=1
  job:
    name: my_sft_trainer_v1
    chdir: false
    override_dirname: data.max_length=768,data.micro_batch_size_per_gpu=1,data.train_batch_size=32,data.train_files=/data3/yxfeng/cscwd27_ranker/gsm8k_rej/train_correct.json,data.val_files=/data3/yxfeng/datasets/gsm8k/sft_base/test.json,model.path=/data3/yxfeng/models/Qwen2.5/Qwen2.5-3B,trainer.default_local_dir=/data3/yxfeng/cscwd27_ranker/sft/qwen2.5-3b-rej,trainer.experiment_name=qwen2.5-3b-rej,trainer.n_gpus_per_node=1,trainer.project_name=gsm8k-sft,trainer.sample_freq=0,trainer.save_freq=after_each_epoch,trainer.test_freq=after_each_epoch,trainer.total_epochs=2
    id: ???
    num: ???
    config_name: sft_trainer_engine
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.8
    version_base: '1.3'
    cwd: /home/yxfeng/cscwd27_ranker/policy
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/yxfeng/cscwd27_ranker/policy/config
      schema: file
      provider: main
    - path: /home/yxfeng/cscwd27_ranker/verl/verl/trainer/config
      schema: file
      provider: hydra.searchpath in main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/yxfeng/cscwd27_ranker/policy/outputs/2026-11-22/10-02-49
    choices:
      profiler: profiler
      optim: fsdp
      engine: fsdp
      model: hf_model
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
